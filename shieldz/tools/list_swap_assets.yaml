      en_US: "Ticker or part of an asset id, e.g. USDC"
      zh_Hans: "Ticker or part of an asset id, e.g. USDC"
      pt_BR: "Ticker or part of an asset id, e.g. USDC"
      ja_JP: "Ticker or part of an asset id, e.g. USDC"
    llm_description: "Ticker or part of an asset id, e.g. USDC"
    form: llm
  - name: chain
    type: string
    required: false
    label:
      en_US: "Chain"
      zh_Hans: "Chain"
      pt_BR: "Chain"
      ja_JP: "Chain"
    human_description:
      en_US: "Chain code, e.g. BASE, ETH, BTC, SOL, TRON"
      zh_Hans: "Chain code, e.g. BASE, ETH, BTC, SOL, TRON"
      pt_BR: "Chain code, e.g. BASE, ETH, BTC, SOL, TRON"
