identity:
  name: "list_swap_assets"
  author: "shieldzcash"
  label:
    en_US: "List swappable assets"
    zh_Hans: "List swappable assets"
    pt_BR: "List swappable assets"
    ja_JP: "List swappable assets"
description:
  human:
    en_US: "Search the 340+ assets that can be quoted, by symbol or chain, with their exact ids and USD prices."
    zh_Hans: "Search the 340+ assets that can be quoted, by symbol or chain, with their exact ids and USD prices."
    pt_BR: "Search the 340+ assets that can be quoted, by symbol or chain, with their exact ids and USD prices."
    ja_JP: "Search the 340+ assets that can be quoted, by symbol or chain, with their exact ids and USD prices."
  llm: "Search swappable crypto assets by symbol (e.g. USDC) and optional chain code (e.g. BASE, ETH, BTC, SOL, TRON). Returns exact asset ids to pass to get_swap_quote, USD prices and whether the contract is verified."
parameters:
